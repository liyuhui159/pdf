plugins { id 'com.android.application' }

android {
    namespace 'com.example.bookautodownloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.bookautodownloader'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.7.0'
    }
}


dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
}
